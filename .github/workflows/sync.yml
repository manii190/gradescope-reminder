name: Sync Gradescope

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright google-api-python-client google-auth-oauthlib
          python -m playwright install chromium

      - name: Create secret files
        run: |
          echo '${{ secrets.CREDENTIALS_JSON }}' > credentials.json
          echo '${{ secrets.TOKEN_JSON }}' > token.json
          echo '${{ secrets.GRADESCOPE_LOGIN_JSON }}' > gradescope_login.json
          
      - name: Run sync
        run: |
          python export_assignments.py
          python sync_tasks.py
      
      - name: Commit updated files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
      
          git add assignments_export.json synced_assignments.json
      
          git commit -m "Update assignment data" || echo "No changes to commit"
      
          git push
